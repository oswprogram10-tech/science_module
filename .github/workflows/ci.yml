name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 타입 검사 · 단위 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json의 packageManager(pnpm@10.28.0)를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: 화면 테스트 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @playwright/test 버전(1.63.0)에 맞는 크로미움과 시스템 의존성을 설치한다.
      - run: pnpm --filter student exec playwright install --with-deps chromium
      # playwright.config.ts의 webServer가 학생 앱(4174), 교사 앱(4175), 수업 중계 서버(8787)를 함께 띄운다.
      - run: pnpm e2e
      - name: 실패 시 리포트·트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/student/playwright-report/
            apps/student/test-results/
          retention-days: 7

  # 안드로이드 앱 빌드(서명 없음). 설치 가능한 디버그 APK가 만들어지는지 확인한다. (iOS 앱은 2026-11-09에 지원을 취소함)
  android-build:
    name: 안드로이드 앱 빌드 (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter student build
      - run: npx cap sync android
        working-directory: apps/student
      # Gradle 배포판은 GitHub 릴리스에서 내려받는데, 가끔 504로 끊긴다. 내려받기만 몇 번 다시 시도한다(빌드·테스트는 다시 하지 않음).
      - name: Gradle 내려받기(재시도)
        working-directory: apps/student/android
        run: |
          for i in 1 2 3 4; do ./gradlew --version && exit 0; echo "다시 시도 $i"; sleep $((i * 20)); done
          exit 1
      # 러너에 설치된 Android SDK(ANDROID_HOME)를 쓴다.
      - run: ./gradlew assembleDebug
        working-directory: apps/student/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
