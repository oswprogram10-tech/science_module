name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 타입 검사 · 단위 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json의 packageManager(pnpm@10.28.0)를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: 화면 테스트 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @playwright/test 버전(1.63.0)에 맞는 크로미움과 시스템 의존성을 설치한다.
      - run: pnpm --filter student exec playwright install --with-deps chromium
      # playwright.config.ts의 webServer가 학생 앱(4174), 교사 앱(4175), 수업 중계 서버(8787)를 함께 띄운다.
      - run: pnpm e2e
      - name: 실패 시 리포트·트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/student/playwright-report/
            apps/student/test-results/
          retention-days: 7

  # 앱 빌드(서명 없음). 설치 가능한 디버그 APK와 시뮬레이터용 앱이 만들어지는지만 확인한다.
  android-build:
    name: 안드로이드 앱 빌드 (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter student build
      - run: npx cap sync android
        working-directory: apps/student
      # 러너에 설치된 Android SDK(ANDROID_HOME)를 쓴다.
      - run: ./gradlew assembleDebug
        working-directory: apps/student/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

  ios-build:
    name: iOS 앱 빌드 (시뮬레이터 + 서명 없는 기기용 ipa)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter student build
      - run: npx cap sync ios
        working-directory: apps/student
      - run: xcodebuild -scheme App -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
        working-directory: apps/student/ios/App
      # 실기기용 ipa(서명 없음). 설치하려면 본인 Apple ID 등으로 다시 서명해야 한다(docs/app-packaging.md).
      - name: 기기용 앱 아카이브(서명 없음)
        working-directory: apps/student/ios/App
        run: >
          xcodebuild -scheme App -sdk iphoneos -configuration Release
          -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: ipa로 묶기
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qr SciBridgeON-unsigned.ipa Payload
          ls -l SciBridgeON-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/SciBridgeON-unsigned.ipa
          retention-days: 90
