name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 타입 검사 · 단위 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # package.json의 packageManager(pnpm@10.28.0)를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: 화면 테스트 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @playwright/test 버전(1.63.0)에 맞는 크로미움과 시스템 의존성을 설치한다.
      # 러너의 기본 apt 미러(azure.archive.ubuntu.com)가 이름 풀이에 실패할 때가 있다.
      # 1) 그대로 시도 2) 미러를 archive.ubuntu.com으로 바꿔 시도
      # 3) 그래도 안 되면 apt 없이 브라우저만 받는다(러너에 필요한 라이브러리는 이미 있고, 빠지는 것은 추가 글꼴뿐이다).
      - name: 크로미움과 시스템 의존성 설치(미러 대체·재시도)
        timeout-minutes: 15
        run: |
          inst() { timeout 300 pnpm --filter student exec playwright install --with-deps chromium; }
          inst && exit 0
          echo "기본 미러 실패: archive.ubuntu.com으로 바꿔 다시 시도"
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          timeout 120 sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 || true
          inst && exit 0
          echo "apt 설치 실패: 브라우저만 설치"
          pnpm --filter student exec playwright install chromium
      # playwright.config.ts의 webServer가 학생 앱(4174), 교사 앱(4175), 수업 중계 서버(8787)를 함께 띄운다.
      - run: pnpm e2e
      - name: 실패 시 리포트·트레이스 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/student/playwright-report/
            apps/student/test-results/
          retention-days: 7

  # 안드로이드 앱 빌드(서명 없음). 설치 가능한 디버그 APK가 만들어지는지 확인한다. (iOS 앱은 2026-11-09에 지원을 취소함)
  android-build:
    name: 안드로이드 앱 빌드 (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter student build
      - run: npx cap sync android
        working-directory: apps/student
      # Gradle 배포판은 GitHub 릴리스에서 내려받는데, 가끔 504로 끊긴다. 내려받기만 몇 번 다시 시도한다(빌드·테스트는 다시 하지 않음).
      - name: Gradle 내려받기(재시도)
        working-directory: apps/student/android
        run: |
          for i in 1 2 3 4; do ./gradlew --version && exit 0; echo "다시 시도 $i"; sleep $((i * 20)); done
          exit 1
      # 러너에 설치된 Android SDK(ANDROID_HOME)를 쓴다.
      - run: ./gradlew assembleDebug
        working-directory: apps/student/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/student/android/app/build/outputs/apk/debug/*.apk
          retention-days: 90

  # 교사 PC 수업 서버(Windows 실행 파일 하나: 서버 + 교사 화면). Node 22 SEA로 만들고, 만든 exe를 실제로 띄워 시험한다.
  windows-host:
    name: 교사 PC 수업 서버 (Windows exe)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 실행 파일 자체가 exe의 바탕이 된다. 내려받기가 가끔 실패하므로 setup-node를 최대 3번 시도한다.
      - uses: actions/setup-node@v4
        id: node1
        continue-on-error: true
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v4
        id: node2
        if: steps.node1.outcome == 'failure'
        continue-on-error: true
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-node@v4
        if: steps.node1.outcome == 'failure' && steps.node2.outcome == 'failure'
        with:
          node-version: 22
          cache: pnpm
      # 패키지 내려받기(레지스트리)도 기존 Gradle 단계처럼 몇 번 다시 시도한다.
      - name: 의존성 설치(재시도)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "다시 시도 $i"
            Start-Sleep -Seconds ($i * 20)
          }
          exit 1
      - run: node --version
      - run: pnpm host:build
      - name: 실행 파일 확인
        shell: pwsh
        run: Get-ChildItem apps/classroom-host/dist | Format-Table Name, Length
      # exe를 백그라운드로 띄우고 http://localhost:8787/ 교사 화면 HTML, /host-info, ws://localhost:8787/ws 수업 만들기 응답을 확인한 뒤 끈다.
      - name: 스모크 시험(exe 실행)
        run: node apps/classroom-host/scripts/smoke.mjs "apps/classroom-host/dist/SciBridgeON-수업서버.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-classroom-host
          path: apps/classroom-host/dist/*.exe
          retention-days: 90
          if-no-files-found: error
